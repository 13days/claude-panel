<aside id="sidebar"><div class="library-header"><span id="libraryTitle">资源</span><span id="libraryCount"></span><button type="button" id="libraryCollapse" class="panel-toggle" aria-label="收起列表" title="收起列表">‹</button></div>
  <div id="projbar"><select id="projSel"></select></div>
  <div id="searchbox"><input id="search" placeholder="搜索名称 / 描述…"></div>
  <div id="capture-filters" hidden></div>
  <div id="filterbar">
    <div class="fbtn active" data-origin="user">仅自建</div>
    <div class="fbtn" data-origin="all">全部</div>
  </div>
  <button id="newbtn">＋ 新建</button>
  <div id="list"></div>
  <div id="footerBtns">
    <button id="exportBtn"></button>
    <button id="importBtn"></button>
  </div>
  <input type="file" id="importFile" accept=".json" style="display:none">
</aside>
<button id="libraryBackdrop" type="button" aria-label="关闭资源列表"></button>

<main id="main">
  <div id="toolbar">
    <button class="btn" id="libraryToggle" type="button" aria-label="打开资源列表" aria-expanded="false">☰</button>
    <div id="toolbarIdentity"><div id="sectionCrumb">工作空间</div><div id="title">未选择<span id="fpath"></span></div></div>
    <div id="capture-nav" class="capture-nav" hidden></div>
    <div id="capture-search" class="capture-search" hidden></div>
    <button class="btn" id="editBtn" disabled>编辑</button>
    <button class="btn primary" id="saveBtn" style="display:none">保存</button>
    <button class="btn" id="cancelBtn" style="display:none">取消</button>
    <button class="btn danger" id="delBtn" disabled>删除</button>
    <select id="langSel" title="Language"></select>
  </div>
  <div id="content">
    <div id="empty">← 从左侧选择一个资源，或点击「新建」</div>
    <div id="metabar"></div>
    <div id="render"></div>
    <textarea id="editor" spellcheck="false" aria-label="文件内容编辑器"></textarea>
  </div>
</main>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="box">
    <h3 id="modalTitle">新建</h3>
    <input id="newName" placeholder="名称（如 my-command）">
    <div class="hint" id="modalHint"></div>
    <div class="row">
      <button class="btn" id="modalCancel" onclick="closeModal()">取消</button>
      <button class="btn primary" id="modalCreate" onclick="createItem()">创建</button>
    </div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="tip"></div>
<button id="toBottom" title="到底部">⬇</button>

<div id="wmodal">
  <div class="wbox">
    <div class="wctrl">
      <div class="range" id="wrange"></div>
      <div style="flex:1"></div>
      <button class="btn primary" id="wdl"></button>
      <button class="btn" id="wclose"></button>
    </div>
    <canvas id="wcanvas"></canvas>
  </div>
</div>

<script src="/feishu-ui.js"></script>
<script>
const $ = s => document.querySelector(s);

const ICONS = {feishu: '<path d="m21 3-7 18-4-7-7-4 18-7ZM10 14l5-5"/>', "terminal": "<path d=\"m5 6 6 6-6 6M13 18h6\"/>", "stats": "<path d=\"M4 19V5m0 14h16M8 15v-4m5 4V7m5 8v-6\"/>", "proxy": "<rect x=\"3\" y=\"4\" width=\"18\" height=\"6\" rx=\"2\"/><rect x=\"3\" y=\"14\" width=\"18\" height=\"6\" rx=\"2\"/><path d=\"M7 7h.01M7 17h.01M12 10v4\"/>", "inspector": "<path d=\"M3 12h4l3-7 4 14 3-7h4\"/>", "sessions": "<path d=\"M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z\"/>", "voyage": "<path d=\"m3 17 9 4 9-4M5 15l7-3 7 3M12 3v9M12 3l7 6h-7M5 15v3m14-3v3\"/>", "commands": "<path d=\"m5 6 6 6-6 6M13 18h6\"/>", "skills": "<path d=\"m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4L12 3Z\"/>", "agents": "<rect x=\"4\" y=\"7\" width=\"16\" height=\"14\" rx=\"3\"/><path d=\"M12 3v4M8 12h.01M16 12h.01M9 17h6M1 12v5m22-5v5\"/>", "plugins": "<path d=\"M9 3v4m6-4v4M7 7h10v5a5 5 0 0 1-10 0V7Zm5 10v4\"/>", "workflows": "<rect x=\"8\" y=\"2\" width=\"8\" height=\"5\" rx=\"1\"/><rect x=\"2\" y=\"17\" width=\"7\" height=\"5\" rx=\"1\"/><rect x=\"15\" y=\"17\" width=\"7\" height=\"5\" rx=\"1\"/><path d=\"M12 7v5M5.5 17v-5h13v5\"/>", "config": "<path d=\"M4 7h16M4 17h16M8 4v6m8 4v6\"/>", "chat": "<path d=\"M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z\"/>", "folder": "<path d=\"M3 8a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9H3V8Z\"/>", "arrow": "<path d=\"M5 12h14m-6-6 6 6-6 6\"/>"};
function icon(type) { return `<svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[type] || ICONS.folder}</svg>`; }
function ui(zh, en, ja = en) { return lang === 'zh' ? zh : lang === 'ja' ? ja : en; }
function viewDescription(type) {
  const descriptions = {
    stats: ['把每一次对话，变成看得见的用量与趋势。', 'A clear view of your conversations, usage, and spending.'],
    feishu: ['在飞书上查看会话、切换项目和接续 Mac 上的 Claude Code。', 'Browse sessions, switch projects and use Claude Code on your Mac from Feishu.'],
    proxy: ['你的账号，一个入口。随时切换，无缝继续。', 'All your accounts. One local gateway. Keep your work flowing.'],
    inspector: ['还原每次模型调用，看清请求、上下文与响应。', 'Inspect every model request, context, and response.'],
    sessions: ['找回工作上下文，继续之前的对话。', 'Find your context and pick up where you left off.'],
    voyage: ['沿着时间，回看你与 Claude 一起完成的工作。', 'Follow the timeline of your work with Claude.'],
    commands: ['把重复工作，整理成触手可及的命令。', 'Keep your everyday commands organized and close at hand.'],
    skills: ['浏览、维护和发现你的 Claude 技能。', 'Explore and maintain the skills in your workspace.'],
    agents: ['为不同的任务，准备合适的专属助手。', 'Purpose-built assistants for the way you work.'],
    plugins: ['集中查看已安装的插件与扩展能力。', 'Your installed plugins and everything they provide.'],
    workflows: ['让多个步骤，成为可以复用的工作流。', 'Bring repeatable steps together into reusable workflows.'],
    config: ['管理 Claude 的指令、偏好与项目配置。', 'Manage instructions, preferences, and project settings.'],
  };
  const copy = descriptions[type] || descriptions.commands;
  return ui(...copy);
}
function viewHeading(type, action = '') {
  return `<div class="view-heading"><div class="view-heading-left"><span class="view-icon">${icon(type)}</span><div><h2>${esc(t('tabs')[type])}</h2><p>${esc(viewDescription(type))}</p></div></div>${action}</div>`;
}
function updateWorkspaceChrome() {
  const dashboard = !!CAPS[state.type].dashboard;
  document.body.dataset.view = dashboard ? 'dashboard' : 'library';
  document.body.dataset.section = state.type;
  $('#sectionCrumb').textContent = ui('工作空间', 'Workspace', 'ワークスペース') + ' / ' + t('tabs')[state.type];
  $('#libraryTitle').textContent = t('tabs')[state.type];
  $('#projbar').hidden = !SCOPED.includes(state.type);
  $('#libraryToggle').hidden = dashboard;
  document.body.dataset.libraryOpen = 'false';
  $('#libraryToggle').setAttribute('aria-expanded', 'false');
  syncPanelToggles();
  document.querySelectorAll('.tab').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.type === state.type);
    tab.setAttribute('aria-current', tab.dataset.type === state.type ? 'page' : 'false');
    tab.title = t('tabs')[tab.dataset.type];
    tab.setAttribute('aria-label', t('tabs')[tab.dataset.type]);
    const label = tab.querySelector('.nav-label'); if (label) label.textContent = t('tabs')[tab.dataset.type];
  });
}
function emptyState() {
  const type = state.type;
  const hint = ui('从左侧选择一项，查看内容与可用操作。', 'Select an item from the library to view its content and actions.');
  $('#empty').innerHTML = `<div class="empty-state"><span class="empty-icon">${icon(type)}</span><h2>${esc(t('tabs')[type])}</h2><p>${esc(viewDescription(type))}</p><p>${esc(hint)}</p>${CAPS[type].new ? `<button class="btn" id="emptyCreate">${esc(newBtnLabel(type))}</button>` : ''}</div>`;
  const create = $('#emptyCreate'); if (create) create.onclick = () => $('#newbtn').click();
}

const SCOPED = ['commands', 'skills', 'agents', 'workflows', 'config'];
let state = { type: 'commands', items: [], current: null, editing: false, keyword: '', origin: 'user', scope: '', projects: [] };

// URL paths address both sections and individual resources; scope stays in the query.
let routeView = '', routeRevision = 0, detailRevision = 0;
function routePath(type = state.type, key = state.current, view = routeView) {
  const query = new URLSearchParams();
  if (SCOPED.includes(type) && state.scope) query.set('scope', state.scope);
  if (type === 'sessions' && key && view) query.set('view', view);
  return '/' + type + (key ? '/' + encodeURIComponent(key) : '') + (query.size ? '?' + query : '');
}
function writeRoute(mode = 'push') {
  const path = routePath();
  if (location.pathname + location.search !== path) history[mode === 'replace' ? 'replaceState' : 'pushState']({}, '', path);
}
function readRoute() {
  const parts = location.pathname.split('/').filter(Boolean);
  if (!parts.length) return null;
  if (!Object.hasOwn(CAPS, parts[0]) || parts.length > 2) throw new Error(ui('页面不存在', 'Page not found'));
  const query = new URLSearchParams(location.search);
  const view = query.get('view') || '';
  if (view && !['detail', 'replay'].includes(view)) throw new Error(ui('页面不存在', 'Page not found'));
  return { type: parts[0], key: parts[1] ? decodeURIComponent(parts[1]) : null, scope: query.get('scope') || '', view };
}
async function restoreRoute() {

    state.scope = SCOPED.includes(target.type) ? target.scope : '';
    renderProjOptions();
    await switchType(target.type, false);
    if (revision !== routeRevision) return;
    if (target.key && !CAPS[target.type].dashboard) {
      if (target.type === 'sessions' && target.view === 'replay') await loadReplay(target.key);

    } else writeRoute('replace');
  } catch (e) {
    $('#empty').style.display = 'none';
    $('#render').style.display = 'block';
    $('#render').textContent = e.message;
  }
}
window.addEventListener('popstate', restoreRoute);

function matchOrigin(it, type) {
  if (!CAPS[type || state.type].filter) return true;
  return state.origin === 'all' || (it.origin || 'user') === 'user';
}

async function api(method, path, body) {
  const q = 'lang=' + lang + (state.scope ? '&scope=' + encodeURIComponent(state.scope) : '');
  const res = await fetch('/api/' + path + (path.includes('?') ? '&' : '?') + q, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) { const error = new Error(data.error || res.statusText); error.status = res.status; throw error; }
  return data;
}

function toast(msg, ok = true) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.color = ok ? 'var(--green)' : 'var(--danger)';
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = 'none', 2200);
}

async function loadCounts() {
  for (const type of Object.keys(CAPS)) {
    if (CAPS[type].dashboard) continue; // 统计页无列表计数
    try {
      const { items } = await api('GET', type);
      if (!Array.isArray(items)) continue;
      document.querySelector(`.tab[data-type="${type}"] .cnt`).textContent = items.filter(it => matchOrigin(it, type)).length;
      if (type === state.type) { state.items = items; renderList(); }
    } catch (e) {}
  }
}

async function switchType(type, updateRoute = true) {
  clearCaptureSearch();
  if (state.editing && !confirm(t('unsaved'))) return;
  closeExpandedWindow();
  ++detailRevision;
  routeView = '';
  state.sessionDetail = false;
  chatAbort?.abort();
  stopRoutePoll();
  stopFeishuPolling();
  disconnectLive();
  stopInspectorPoll();
  state.items = [];
  $('#list').replaceChildren();
  state.type = type; state.current = null; state.editing = false; state.keyword = '';
  if (updateRoute) { ++routeRevision; writeRoute(); }
  updateWorkspaceChrome();
  $('#capture-nav').hidden = true;
  state.inspectorSession = ''; state.inspectorPurpose = '';
  renderCaptureFilters();
  $('#search').value = '';
  $('#search').placeholder = type === 'sessions' ? t('searchSessionsPh') : t('search');
  $('#footerBtns').style.display = type === 'config' ? 'flex' : 'none';
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.type === type));
  $('#newbtn').style.display = CAPS[type].new ? 'block' : 'none';
  $('#newbtn').textContent = newBtnLabel(type);
  $('#filterbar').style.display = CAPS[type].filter ? 'flex' : 'none';
  $('#delBtn').textContent = type === 'plugins' ? t('uninstall') : t('del');
  localStorage.setItem('panel-section', type);
  showEmpty();
  if (type === 'proxy') { await renderProxyTab(); return; }
  if (type === 'feishu') { await renderFeishuGateway(); return; }
  if (type === 'voyage') { await renderVoyage(); return; }
  if (CAPS[type].dashboard) { await renderStatsTab(); return; }
  if (type === 'inspector') startInspectorPoll(); else stopInspectorPoll();
  if (type === 'sessions') startRoutePoll();
  try {
    const { items } = await api('GET', type);
    if (state.type !== type) return;
    state.items = items;
    document.querySelector(`.tab[data-type="${type}"] .cnt`).textContent = items.filter(it => matchOrigin(it, type)).length;
    renderList();
  } catch (e) { toast(t('loadFail') + e.message, false); }
}

function renderList({ revealCurrent = false } = {}) {
  const kw = state.keyword.toLowerCase();
  const list = $('#list');
  const previousScroll = list.scrollTop;
  if (CAPS[state.type].dashboard) { list.replaceChildren(); return; }
  list.innerHTML = '';
  const visibleItems = state.items
    .filter(it => matchOrigin(it))
    .filter(it => state.type !== 'inspector' || ((!state.inspectorSession || it.sessionId === state.inspectorSession) && (!state.inspectorPurpose || it.purpose === state.inspectorPurpose)))
    .filter(it => !kw || it.name.toLowerCase().includes(kw) || (it.description || '').toLowerCase().includes(kw));
  $('#libraryCount').textContent = visibleItems.length + ui(' 项', ' items', ' 件');
  if (!visibleItems.length) { const note = document.createElement('p'); note.className = 'list-empty'; note.textContent = kw ? ui('没有找到匹配的内容', 'No matching results') : ui('这里还没有内容', 'Nothing here yet'); list.append(note); }
  visibleItems.forEach(it => {
      const key = it.key || it.name;
      const div = document.createElement('button');
      div.type = 'button';
      const selected = state.current != null && String(state.current) === String(key);
      div.className = 'item' + (selected ? ' active' : '');
      if (selected) div.setAttribute('aria-current', 'true');
      if (state.type === 'sessions') div.dataset.sid = String(key).toLowerCase();
      const prefix = state.type === 'commands' ? '/' : '';
      div.innerHTML = `<div class="nm"></div><div class="ds"></div>`;
      div.querySelector('.nm').textContent = prefix + it.name;
      if (state.type === 'inspector') {
        div.classList.add('capture-item'); div.dataset.captureId = String(key);
        const sequence = document.createElement('span'); sequence.className = 'capture-sequence'; sequence.textContent = '#' + key;
        sequence.title = ui('全局请求序号', 'Global request number');
        const name = document.createElement('span'); name.className = 'capture-name'; name.textContent = it.name;
        div.querySelector('.nm').replaceChildren(sequence, name);
      }
      if (state.origin === 'all' && it.origin === 'installed') {
        const tag = document.createElement('span');
        tag.className = 'tag installed';
        const src = it.source || 'installed';
        tag.textContent = src === 'builtin' ? t('tagBuiltin')
          : src.startsWith('plugin:') ? t('tagPluginPrefix') + src.slice(7)
          : t('tagInstalled');
        div.querySelector('.nm').appendChild(tag);
      }
      if (it.uses > 0) {
        const utag = document.createElement('span');
        utag.className = 'tag uses';
        utag.textContent = '×' + it.uses;
        utag.title = t('usesTip');
        div.querySelector('.nm').appendChild(utag);
      }
      div.querySelector('.ds').textContent = it.description || '';
      div.onclick = () => openItem(key, it.name);
      if (state.type === 'sessions') {
        const row = document.createElement('div'); row.className = 'session-row';
        const menu = document.createElement('details'); menu.className = 'session-menu';
        const summary = document.createElement('summary'); summary.textContent = '···'; summary.setAttribute('aria-label', rt('会话操作', 'Session actions'));
        const actions = document.createElement('div'); actions.className = 'session-menu-actions';
        for (const [action, label] of [['rename', rt('重命名', 'Rename')], ['delete', rt('删除会话', 'Delete session')]]) {
          const button = document.createElement('button'); button.type = 'button'; button.textContent = label;
          if (action === 'delete') button.className = 'danger';
          button.onclick = () => { menu.open = false; editSession(it, action); }; actions.append(button);
        }
        menu.append(summary, actions); row.append(div, menu); list.append(row);
      } else list.appendChild(div);
    });
  if (state.type === 'sessions') paintRoutes();
  list.scrollTop = previousScroll;
  if (revealCurrent && state.type === 'inspector') {
    const current = list.querySelector('.item.active');
    if (current) {
      const row = current.getBoundingClientRect(), viewport = list.getBoundingClientRect();
      list.scrollTop += (row.top + row.bottom - viewport.top - viewport.bottom) / 2;
    }
  }
}

function editSession(item, action) {
  const id = item.key;
  if (chatView.run?.activeId && (chatView.sessionId === id || chatView.liveId === id)) { toast(rt('请先停止生成，再管理此会话', 'Stop generation before editing this session'), false); return; }
  const removing = action === 'delete';
  const dialog = document.createElement('dialog'); dialog.className = 'session-dialog';
  dialog.innerHTML = `<form><h3>${esc(removing ? rt('删除会话', 'Delete session') : rt('重命名会话', 'Rename session'))}</h3><p></p><input aria-label="${esc(rt('会话名称', 'Session name'))}" maxlength="80" required><div class="session-dialog-footer"><button type="button" class="btn">${esc(rt('取消', 'Cancel'))}</button><button type="submit" class="btn ${removing ? 'danger' : 'primary'}">${esc(removing ? rt('删除', 'Delete') : rt('保存', 'Save'))}</button></div><p class="session-dialog-error" role="alert"></p></form>`;
  dialog.querySelector('p').textContent = removing ? rt('从面板删除此会话？Claude CLI 的原始记录会保留。', 'Remove this session from the panel? The original Claude CLI records will be kept.') : rt('给这段对话起一个容易找到的名字。', 'Give this conversation a name that is easy to find.');
  const input = dialog.querySelector('input'); input.value = item.name; input.hidden = removing; input.required = !removing;
  const close = () => { dialog.close(); dialog.remove(); };
  dialog.querySelector('button[type="button"]').onclick = close;
  dialog.addEventListener('cancel', e => { e.preventDefault(); close(); });
  dialog.querySelector('form').onsubmit = async e => {
    e.preventDefault(); const submit = dialog.querySelector('button[type="submit"]'); submit.disabled = true;
    try {
      const result = await api(removing ? 'DELETE' : 'PATCH', `sessions/${encodeURIComponent(id)}`, removing ? undefined : { title: input.value });
      if (removing) state.items = state.items.filter(it => it.key !== id);
      else { item.name = result.title; item.titleSource = 'manual'; const stored = state.items.find(it => it.key === id); if (stored) { stored.name = result.title; stored.titleSource = 'manual'; } }
      if (state.type === 'sessions') {
        renderList(); document.querySelector('.tab[data-type="sessions"] .cnt').textContent = state.items.length;
        if (state.current === id) { if (removing) { chatAbort?.abort(); state.current = null; showEmpty(); } else $('#title').firstChild.textContent = result.title; }
      }
      close();
    } catch (err) { dialog.querySelector('.session-dialog-error').textContent = err.message; submit.disabled = false; }
  };
  marker.before(dialog); dialog.showModal(); if (!removing) input.select();
}
function showEmpty() {
  $('#empty').style.display = 'block';
  emptyState();
  $('#render').innerHTML = '';
  $('#render').classList.remove('wide');
  $('#metabar').replaceChildren();
  $('#metabar').style.display = 'none';
  $('#editor').style.display = 'none';
  $('#title').firstChild.textContent = t('tabs')[state.type];
  $('#fpath').textContent = '';
  $('#editBtn').disabled = $('#delBtn').disabled = true;
  setEditMode(false);
}

async function openItem(key, displayName) {
  if (state.editing && !confirm(t('unsaved'))) return;
  state.editing = false;
  closeExpandedWindow();
  if (state.type === 'inspector') return openInspect(key);
  if (state.type === 'sessions' && !state.sessionDetail && chatView.sessionId === key && chatView.run && $('#chat-messages')) return;
  chatAbort?.abort();
  // 会话默认打开为可接续的对话；“详情”按钮才走原来的说明页
  if (state.type === 'sessions' && !state.sessionDetail) return openSessionChat(key);
  const view = state.sessionDetail ? 'detail' : '';
  state.sessionDetail = false;
  const revision = ++detailRevision;
  try {
    const type = state.type;
    const d = await api('GET', `${type}/${encodeURIComponent(key)}`);
    if (state.type !== type || revision !== detailRevision) return;
    state.current = key;
    routeView = view; writeRoute();
    document.body.dataset.libraryOpen = 'false';
    $('#libraryToggle').setAttribute('aria-expanded', 'false');
    state.raw = d.content;
    $('#empty').style.display = 'none';
    $('#title').firstChild.textContent = (state.type === 'commands' ? '/' : '') + (displayName || d.name);
    state.currentOrigin = d.origin || 'user';
    const caps = CAPS[state.type];
    const readonlyCmd = state.type === 'commands' && key.includes('!');  // 内置或插件提供的命令
    const note = d.builtin ? t('noteBuiltin')
      : readonlyCmd ? t('notePluginCmd')
      : d.plugin ? t('notePlugin')
      : d.origin === 'installed' ? t('noteInstalled') : '';
    $('#fpath').textContent = d.path.replace(/^\/Users\/[^/]+/, '~') + note;
    $('#editBtn').disabled = !caps.edit || d.origin === 'installed';
    $('#delBtn').disabled = !caps.del || readonlyCmd;
    setEditMode(false);
    renderDoc(d);
    if (state.type === 'sessions' && d.session && d.hasTranscript) {
      const box = document.createElement('div');
      box.style.cssText = 'margin:0 0 18px;padding:14px 16px;border:1px solid rgba(217,123,79,.4);border-radius:12px;background:rgba(217,123,79,.08)';
      const rb = document.createElement('button');
      rb.className = 'btn primary';
      rb.style.fontSize = '14px';
      rb.textContent = t('replayBtn');
      rb.onclick = () => loadReplay(key);
      const sub = document.createElement('div');
      sub.style.cssText = 'font-size:12px;color:var(--muted);margin-top:8px';
      sub.textContent = t('replaySub');
      const back = document.createElement('button');
      back.className = 'btn'; back.style.cssText = 'font-size:14px;margin-left:8px';
      back.textContent = ui('接续对话', 'Continue chat', '会話を続ける');
      back.onclick = () => openSessionChat(key);
      box.append(rb, back, sub);
      $('#render').prepend(box);
    }
    renderList();
  } catch (e) { toast(t('loadFail') + e.message, false); }
}

function renderDoc(d) {
  $('#render').classList.remove('wide');
  const metabar = $('#metabar');
  const keys = Object.keys(d.meta || {});
  if (keys.length) {
    metabar.style.display = 'flex';
    metabar.innerHTML = '';
    keys.forEach(k => {
      const c = document.createElement('div');
      c.className = 'chip';
      const b = document.createElement('b'); b.textContent = k;
      c.appendChild(b);
      c.appendChild(document.createTextNode(d.meta[k]));
      c.title = d.meta[k];
      metabar.appendChild(c);
    });
  } else metabar.style.display = 'none';
  if (d.lang === 'json' || d.lang === 'js') {
    $('#render').innerHTML = `<pre><code>${esc(d.content)}</code></pre>`;
    return;
  }
  const body = d.content.replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/, '');
  $('#render').innerHTML = md(body);
}

function setEditMode(on) {
  state.editing = on;
  $('#editor').style.display = on ? 'block' : 'none';
  $('#render').style.display = on ? 'none' : 'block';
  $('#metabar').style.display = on ? 'none' : ($('#metabar').innerHTML ? 'flex' : 'none');
  $('#editBtn').style.display = on ? 'none' : 'inline-block';
  $('#saveBtn').style.display = on ? 'inline-block' : 'none';
  $('#cancelBtn').style.display = on ? 'inline-block' : 'none';
  if (on) { $('#editor').value = state.raw; $('#editor').focus(); }
}

// ---------- CRUD 操作 ----------
$('#editBtn').onclick = () => setEditMode(true);
$('#cancelBtn').onclick = () => { setEditMode(false); };
$('#saveBtn').onclick = async () => {
  try {
    await api('PUT', `${state.type}/${encodeURIComponent(state.current)}`, { content: $('#editor').value });
    state.raw = $('#editor').value;
    toast('已保存 ✓');
    setEditMode(false);
    const d = await api('GET', `${state.type}/${encodeURIComponent(state.current)}`);

};
$('#delBtn').onclick = async () => {
  const label = t('typeLabel')[state.type];
  const detail = state.type === 'plugins' ? t('delPlugin')
    : state.currentOrigin === 'installed' ? t('delInstalled')
    : (state.type === 'skills' ? t('delSkillDir') : t('delPlain'));
  const msg = state.type === 'plugins'
    ? fmt(t('confirmUninstall'), { name: state.current, detail })
    : fmt(t('confirmDel'), { label, name: state.current, detail });
  if (!confirm(msg)) return;
  try {
    await api('DELETE', `${state.type}/${encodeURIComponent(state.current)}`);
    toast(t('deleted'));

    showEmpty();
    switchType(state.type);

$('#newbtn').onclick = () => {

function closeModal() { $('#modal').style.display = 'none'; }
$('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
async function createItem() {
  const name = $('#newName').value.trim();
  if (!name) return toast(t('nameRequired'), false);
  try {
    const content = t('templates')[state.type].replaceAll('{NAME}', name);
    await api('POST', state.type, { name, content });
    closeModal();
    toast(t('created'));
    await switchType(state.type);
    openItem(name);
    setTimeout(() => setEditMode(true), 100);
  } catch (e) { toast(t('createFail') + e.message, false); }

$('#search').addEventListener('input', e => { state.keyword = e.target.value; renderList(); });
$('#search').addEventListener('keydown', async e => {
  if (e.key !== 'Enter' || state.type !== 'sessions') return;
  const q = e.target.value.trim();
  if (q.length < 2) return;
  try {
    const { results } = await api('GET', 'search?q=' + encodeURIComponent(q));
    renderSearchResults(results);
  } catch (err) { toast(t('loadFail') + err.message, false); }
});

function renderSearchResults(results) {
  const list = $('#list');

function voyageHTML(d) {

    }

  }
  h += '</div>';
  h += `<div class="river-axis"><span>${esc(d.span.from)}</span><span>${esc(d.span.to)} →</span></div>`;

  // 故事线（航段）
  h += `<h3 style="font-size:13.5px;margin:22px 0 8px;color:var(--accent2)">🚩 ${esc(t('voyageLegs'))}</h3>`;
  for (const l of d.storylines) {
    h += `<details class="leg"><summary>
      <span class="legdot" style="background:${projColor(l.proj, d.projects)}"></span>
      <span class="leg-title">${esc(l.title)}</span>
      <span class="leg-meta">${esc(l.proj)} · ${l.from}→${l.to} · ${fmt(t('voyageLegMeta'), { s: l.sessionCount, d: l.days })}</span>
    </summary><div class="leg-sessions">`;

      </div>`;
    }
    h += '</div></details>';
  }
  return h;
}

// Search source text before opening lazy blocks; render only the selected match.
let captureFind = null;
function findCaptureMatches(blocks, query) {
  if (!query) return [];

    const text = block.text(), offsets = [];

    if (offsets.length) { groups.push({ block, offsets, start: total }); total += offsets.length; }
  }

}

}

  }

    previous.disabled = next.disabled = !total; clear.disabled = !input.value;
  };

    removeMark();
    if (!total) { active = -1; update(); return; }

    const group = groups.find(item => active < item.start + item.offsets.length);
    const offset = group.offsets[active - group.start], target = group.block.reveal();
    const text = target.textContent;
    mark = document.createElement('mark'); mark.className = 'capture-search-hit'; mark.textContent = text.slice(offset, offset + lastQuery.length);
    target.replaceChildren(document.createTextNode(text.slice(0, offset)), mark, document.createTextNode(text.slice(offset + lastQuery.length)));

// Reading view decodes JSON strings so prompts have real paragraphs and line breaks.
function formatCapturePayload(raw, mode = 'readable') {
  const source = String(raw ?? '');
  if (mode === 'raw') return source;
  let value;
  try { value = JSON.parse(source); }
  catch {
    const events = source.split(/\r?\n\r?\n/).filter(chunk => chunk.trim());
    if (!events.length || !events.every(chunk => /^(?:event:|data:|:)/m.test(chunk))) return source;
    value = events.map(chunk => {
      const data = chunk.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trimStart()).join('\n');
      try { return JSON.parse(data); } catch { return data || chunk; }
    });
  }
  if (mode === 'json') return JSON.stringify(value, null, 2);
  const lines = [];
  const visit = (item, depth, label) => {
    const indent = '  '.repeat(depth);
    if (item !== null && typeof item === 'object') {
      const entries = Array.isArray(item) ? item.map((entry, i) => ['[' + i + ']', entry]) : Object.entries(item);
      lines.push(indent + label + (Array.isArray(item) ? ' [' + item.length + ']' : '') + (entries.length ? ':' : (Array.isArray(item) ? '' : ' {}')));
      for (const [key, child] of entries) visit(child, depth + 1, key);
    } else if (typeof item === 'string' && item.includes('\n')) {
      lines.push(indent + label + ':');
      for (const line of item.split('\n')) lines.push(indent + '  ' + line);
      lines.push('');
    } else lines.push(indent + label + ': ' + (typeof item === 'string' ? item : JSON.stringify(item)));
  };
  if (value !== null && typeof value === 'object') {
    for (const [key, child] of (Array.isArray(value) ? value.map((entry, i) => ['[' + i + ']', entry]) : Object.entries(value))) visit(child, 0, key);
    if (!lines.length) return JSON.stringify(value);
  } else return typeof value === 'string' ? value : JSON.stringify(value);
  return lines.join('\n');
}

// ---------- 轻量 Markdown 渲染 ----------
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src) {
  const lines = src.split(/\r?\n/);
  let html = '', i = 0;
  while (i < lines.length) {
    const l = lines[i];
    // 代码块
    if (/^```/.test(l)) {
      let buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
      continue;
    }
    // 表格
    if (l.includes('|') && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])) {
      const cells = r => r.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());
      let t = '<table><thead><tr>' + cells(l).map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].includes('|')) {
        t += '<tr>' + cells(lines[i]).map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        i++;
      }
      html += t + '</tbody></table>';
      continue;
    }
    // 标题
    const h = l.match(/^(#{1,6})\s+(.*)/);
    if (h) { html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; i++; continue; }
    // 分割线
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { html += '<hr>'; i++; continue; }
    // 引用
    if (/^\s*>/.test(l)) {
      let buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ''));
      html += `<blockquote>${md(buf.join('\n'))}</blockquote>`;
      continue;
    }
    // 列表
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      let items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*+]|\d+\.)\s+/, ''));
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      html += `<${tag}>` + items.map(it => `<li>${inline(it)}</li>`).join('') + `</${tag}>`;
      continue;
    }
    // 空行
    if (!l.trim()) { i++; continue; }
    // 段落
    let buf = [l];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#|```|\s*([-*+]|\d+\.)\s|\s*>|\s*-{3,}\s*$)/.test(lines[i]) && !lines[i].includes('|')) {
      buf.push(lines[i]); i++;
    }
    html += `<p>${inline(buf.join(' '))}</p>`;
  }
  return html;
}

function rr(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.stroke(); }
}

function drawWrapped(d) {

  const W = 1080, H = 1350, S = 2; // 2x 导出更清晰

  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  const F = '-apple-system, "PingFang SC", "Hiragino Sans", sans-serif';
  const M = 'ui-monospace, "SF Mono", Menlo, monospace';

  // 背景：深色渐变 + 顶部品牌色光晕
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f1115'); g.addColorStop(1, '#191019');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const rg = ctx.createRadialGradient(W / 2, 160, 0, W / 2, 160, 560);
  rg.addColorStop(0, 'rgba(217,123,79,.16)'); rg.addColorStop(1, 'rgba(217,123,79,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, W, 720);

  // 头部
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8965f'; ctx.font = `700 30px ${F}`;
  ctx.fillText('⌘   C L A U D E   C O D E   W R A P P E D', W / 2, 98);
  const rangeLbl = d.days === 7 ? t('wR7') : d.days === 30 ? t('wR30') : t('rgAll');
  ctx.fillStyle = '#8b93a5'; ctx.font = `400 26px ${F}`;
  ctx.fillText(`${rangeLbl} · ${d.from} → ${d.to}`, W / 2, 146);

function statsHTML(d) {
  let h = viewHeading('stats', `<button class="btn" id="wrappedBtn">${icon('arrow')} ${esc(t('wrappedBtn').replace(/^🎁\s*/, ''))}</button>`);

  h += '<div class="stats-grid">';

  // 每日消息量，单一系列：单色 + 峰值直接标注 + 悬浮提示 + 时间范围切换
  const recent = statsRange ? days.slice(-statsRange) : days;
  if (recent.length) {
    const max = Math.max(...recent.map(x => x.messageCount), 1);
    const maxIdx = recent.findIndex(x => x.messageCount === max);
    const ranges = [[14, t('rg14')], [42, t('rg42')], [90, t('rg90')], [0, t('rgAll')]];
    h += `<div class="chart"><div class="chartHead"><h3>${esc(t('stDaily'))}</h3><div class="range">`
      + ranges.map(([v, lbl]) => `<button class="rangebtn${v === statsRange ? ' active' : ''}" data-range="${v}">${esc(lbl)}</button>`).join('')
      + `</div></div><div class="bars">`;
    recent.forEach((x, i) => {
      const pct = Math.max(2, Math.round(x.messageCount / max * 100));
      const tip = `${x.date} · ${x.messageCount.toLocaleString()} msg`;
      h += `<div class="b" style="height:${pct}%" data-tip="${esc(tip)}">${i === maxIdx ? `<span class="lbl">${fmtNum(max)}</span>` : ''}</div>`;
    });
    h += `</div><div class="axis"><span>${esc(recent[0].date)}</span><span>${esc(recent[recent.length - 1].date)}</span></div></div>`;
  }

  // 模型 token 用量（类别 = 身份，固定顺序取色，名称直接标注）
  const models = Object.entries(d.modelUsage || {})
    .map(([m, u]) => ({ m, v: (u.inputTokens || 0) + (u.outputTokens || 0) }))
    .filter(x => x.v > 0)
    .sort((a, b) => b.v - a.v);
  if (models.length) {
    const shown = models.slice(0, 7);
    const rest = models.slice(7).reduce((s, x) => s + x.v, 0);
    if (rest > 0) shown.push({ m: t('stOther'), v: rest });
    const maxV = shown[0].v;
    h += `<div class="chart"><h3>${esc(t('stModels'))}</h3>`;
    shown.forEach((x, i) => {
      const pct = Math.max(1, Math.round(x.v / maxV * 100));
      const u = (d.modelUsage || {})[x.m];
      const tip = u ? `${x.m} · in ${u.inputTokens.toLocaleString()} · out ${u.outputTokens.toLocaleString()} · cache-r ${fmtNum(u.cacheReadInputTokens)} · cache-w ${fmtNum(u.cacheCreationInputTokens)}` : x.m + ' · ' + x.v.toLocaleString();
      h += `<div class="hbar-row" data-tip="${esc(tip)}">
        <div class="hbar-name">${esc(x.m)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
        <div class="hbar-val">${fmtNum(x.v)}</div></div>`;
    });
    h += '</div>';
  }

  // 24 小时活跃分布，单一系列
  const hours = Array.from({ length: 24 }, (_, i) => d.hourCounts?.[String(i)] || 0);
  const hmax = Math.max(...hours, 1);
  const hmaxIdx = hours.indexOf(hmax);
  h += `<div class="chart"><h3>${esc(t('stHours'))}</h3><div class="bars" style="height:80px">`;
  hours.forEach((v, i) => {
    const pct = Math.max(2, Math.round(v / hmax * 100));
    h += `<div class="b" style="height:${pct}%" data-tip="${i}:00 – ${i + 1}:00 · ${v.toLocaleString()}">${i === hmaxIdx ? `<span class="lbl">${fmtNum(hmax)}</span>` : ''}</div>`;
  });
  h += `</div><div class="axis"><span>0:00</span><span>12:00</span><span>23:00</span></div></div>`;

  // 使用排行：命令（来自 history，长期）+ 技能/智能体/工作流（来自 transcripts，约 30 天）
  const usage = d.usage || {};
  const rankChart = (title, entries) => {
    if (!entries.length) return '';
    const maxV = entries[0][1];
    let c = `<div class="chart"><h3>${esc(title)}</h3>`;
    entries.forEach(([name, v], i) => {
      const pct = Math.max(1, Math.round(v / maxV * 100));
      c += `<div class="hbar-row" data-tip="${esc(name + ' · ' + v.toLocaleString())}">
        <div class="hbar-name">${esc(name)}</div>
        <div class="hbar-track"><div class="hbar-fill" style="width:${pct}%;background:${CHART_COLORS[i % CHART_COLORS.length]}"></div></div>
        <div class="hbar-val">${v.toLocaleString()}</div></div>`;
    });
    return c + '</div>';
  };
  const top = obj => Object.entries(obj || {}).sort((a, b) => b[1] - a[1]).slice(0, 10);
  h += rankChart(t('stTopCommands'), top(usage.commands).map(([n, v]) => ['/' + n, v]));
  const mixed = [
    ...top(usage.skills).map(([n, v]) => [n + ' · ' + t('typeLabel')['skills'], v]),
    ...top(usage.agents).map(([n, v]) => [n + ' · ' + t('typeLabel')['agents'], v]),
    ...top(usage.workflows).map(([n, v]) => [n + ' · ' + t('typeLabel')['workflows'], v]),
  ].sort((a, b) => b[1] - a[1]).slice(0, 10);
  h += rankChart(t('stTopSkills'), mixed);

  // ccusage daily 风格的逐日明细表
  const rows = d.dailyTable || [];
  if (rows.length) {
    const num = n => `<td class="num">${n.toLocaleString()}</td>`;
    h += `<div class="chart"><h3>${esc(t('stTable'))}</h3><div style="overflow-x:auto"><table class="usage">`;
    h += `<thead><tr><th>${esc(t('thDate'))}</th><th>${esc(t('thModels'))}</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cache Create</th><th class="num">Cache Read</th><th class="num">Total Tokens</th><th class="num">Cost (USD)</th></tr></thead><tbody>`;
    for (const r of rows) {
      h += `<tr><td>${esc(r.date)}</td><td>${r.models.map(m => '- ' + esc(m)).join('<br>')}</td>`
        + num(r.input) + num(r.output) + num(r.cacheCreate) + num(r.cacheRead) + num(r.totalTokens)
        + `<td class="num">$${r.cost.toFixed(2)}${r.costKnown ? '' : ' *'}</td></tr>`;
    }
    const tt = d.totals || {};
    h += `<tr class="total"><td>${esc(t('totalRow'))}</td><td></td>`
      + num(tt.input || 0) + num(tt.output || 0) + num(tt.cacheCreate || 0) + num(tt.cacheRead || 0) + num(tt.totalTokens || 0)
      + `<td class="num">$${(tt.cost || 0).toFixed(2)}${tt.costKnown ? '' : ' *'}</td></tr>`;
    h += `</tbody></table></div><div style="font-size:11.5px;color:var(--muted);margin-top:10px">${esc(t('stCostNote'))}</div></div>`;
  }
  return h + '</div>';
}

// ---------- 会话里的 Claude Code 对话 ----------
// 新建对话（＋）或打开已有会话后在此接续；每条消息由本机 `claude -p [--resume]` 执行。
let chatAbort = null, chatModel = localStorage.getItem('panel-chat-model') || '';
let chatScrollObserver = null;
let chatView = { sessionId: '', cwd: '', messages: [] };
// 每个会话的代理账号：Claude Code 请求里带 session id，代理据此记录实时账号，也可把单个会话固定到某个账号
let routeInfo = null, routeTimer = null, sessionListEpoch = 0, sessionListRefreshing = false, openChatRefreshing = false;
const ROUTE_MODES = { manual: ['手动', 'Manual'], failover: ['故障切换', 'Failover'], 'round-robin': ['轮询', 'Round robin'] };
function startRoutePoll() {
  stopRoutePoll();
  const epoch = sessionListEpoch;
  const tick = async () => {
    if (state.type !== 'sessions' || epoch !== sessionListEpoch) return;
    if (!document.hidden) await Promise.allSettled([refreshRoutes(), refreshSessionList(), refreshOpenChat()]);
    if (state.type === 'sessions' && epoch === sessionListEpoch) routeTimer = setTimeout(tick, chatView.run ? 2500 : 10000);
  };
  tick();
}
function stopRoutePoll() { clearTimeout(routeTimer); routeTimer = null; sessionListEpoch++; }
document.addEventListener('visibilitychange', () => { if (!document.hidden && state.type === 'sessions') startRoutePoll(); });
async function refreshSessionList() {
  if (state.type !== 'sessions' || sessionListRefreshing) return;
  const epoch = sessionListEpoch;
  sessionListRefreshing = true;
  try {
    const { items } = await api('GET', 'sessions');
    if (state.type !== 'sessions' || epoch !== sessionListEpoch || document.querySelector('.session-menu[open], .session-dialog[open]')) return;
    if (chatView.optimisticItem && !items.some(item => item.key === chatView.sessionId)) items.unshift(chatView.optimisticItem);
    else if (items.some(item => item.key === chatView.sessionId)) chatView.optimisticItem = null;
    const signature = rows => JSON.stringify(rows.map(item => [item.key, item.name, item.description, item.titleSource]));
    if (signature(items) === signature(state.items)) return;
    const list = $('#list'), scroll = list.scrollTop;
    const focusedId = list.contains(document.activeElement) ? document.activeElement.closest('.session-row')?.querySelector('[data-sid]')?.dataset.sid : '';
    state.items = items; renderList(); list.scrollTop = scroll;
    const selected = items.find(item => item.key === state.current);
    if (selected && $('#chat-messages')) $('#title').firstChild.textContent = selected.name;
    if (focusedId) Array.from(list.querySelectorAll('[data-sid]')).find(item => item.dataset.sid === focusedId)?.focus({ preventScroll: true });
    document.querySelector('.tab[data-type="sessions"] .cnt').textContent = items.length;
  } catch {} finally { sessionListRefreshing = false; }
}
async function refreshOpenChat() {
  const v = chatView;
  if (state.type !== 'sessions' || !v.sessionId || v.run || openChatRefreshing || !$('#chat-messages')) return;
  openChatRefreshing = true;
  try {
    const d = await api('GET', `sessions/${encodeURIComponent(v.sessionId)}/messages?limit=${Math.max(80, v.messages.length)}${v.revision ? '&since=' + encodeURIComponent(v.revision) : ''}`);
    if (chatView !== v || state.type !== 'sessions' || v.run || !$('#chat-messages')) return;
    if (d.unchanged) return;
    if (d.liveReplay && d.jobId === v.lastReplayJobId) return;
    if (v.readingImages || v.loadingOlder || document.querySelector('.chat-picker[open]')) return;
    v.revision = d.revision;
    if (!d.liveReplay && JSON.stringify(v.messages) === JSON.stringify(d.messages)) return;
    const box = $('#chat-messages'), prompt = $('#chat-prompt');
    const view = { top: box.scrollTop, follow: box.scrollHeight - box.scrollTop - box.clientHeight < 60, draft: prompt.value, start: prompt.selectionStart, end: prompt.selectionEnd, focus: document.activeElement?.id, model: $('#chat-model').value };
    const key = article => article.querySelector('.chat-tool')?.dataset.toolId || article.querySelector('.chat-message-body')?.textContent.slice(0, 120);
    const anchor = Array.from(box.querySelectorAll('.chat-message')).find(article => article.getBoundingClientRect().bottom > box.getBoundingClientRect().top);
    if (anchor) { view.anchor = key(anchor); view.offset = anchor.getBoundingClientRect().top - box.getBoundingClientRect().top; }
    v.messages = d.messages; v.truncated = d.truncated; v.historyBefore = d.historyBefore;
    renderChat();
    $('#chat-prompt').value = view.draft; $('#chat-prompt').setSelectionRange(view.start, view.end); $('#chat-model').value = view.model;
    if (view.focus) document.getElementById(view.focus)?.focus({ preventScroll: true });
    const restore = () => {
      if (chatView !== v) return;
      const current = $('#chat-messages'); current.scrollTop = view.follow ? current.scrollHeight : view.top;
      const target = !view.follow && view.anchor && Array.from(current.querySelectorAll('.chat-message')).find(article => key(article) === view.anchor);
      if (target) current.scrollTop += target.getBoundingClientRect().top - current.getBoundingClientRect().top - view.offset;
      current.updateScrollControls?.();
    };
    restore();
    if (d.liveReplay) { v.restoreReplayScroll = restore; streamChat(v, { reconnect: true }); }
  } catch {} finally { openChatRefreshing = false; }
}
async function refreshRoutes() {
  try { routeInfo = await api('GET', 'proxy/sessions'); } catch { return; }
  if (state.type === 'sessions') paintRoutes();
}
function routeGlobalLabel() {
  const r = routeInfo; if (!r) return rt('全局路由', 'Global route');
  const m = ROUTE_MODES[r.mode] || [r.mode, r.mode];
  const sel = r.mode === 'manual' && r.accounts.find(a => a.id === r.selected);
  return `${rt('跟随全局', 'Follow global')} · ${rt(m[0], m[1])}${sel ? ' · ' + sel.name : ''}`;
}
function routeOf(id) {
  const r = routeInfo; if (!r || !id) return null;
  const sid = id.toLowerCase(), e = r.items.find(x => x.id === sid), pin = r.routes[sid] || '';
  const pinName = pin && (r.accounts.find(a => a.id === pin) || {}).name;
  return e || pin ? { ...(e || {}), pin, pinName } : null;
}
function routeOptions(current) {
  const r = routeInfo, opts = [`<option value="">${esc(routeGlobalLabel())}</option>`];
  for (const a of (r ? r.accounts : []).filter(a => a.enabled || a.id === current)) opts.push(`<option value="${esc(a.id)}"${a.id === current ? ' selected' : ''}${a.enabled ? '' : ' disabled'}>📌 ${esc(a.name)}</option>`);
  return opts.join('');

function paintRoutes() {
  document.querySelectorAll('#list .item[data-sid]').forEach(el => {
    const info = routeOf(el.dataset.sid), nm = el.querySelector('.nm');
    let badge = nm.querySelector('.route-badge');

    if (!badge) { badge = document.createElement('span'); nm.appendChild(badge); }
    badge.className = 'route-badge' + (info.running ? ' running' : '') + (info.pin ? ' pinned' : '');
    const name = document.createElement('span'); name.className = 'route-badge-name';
    name.textContent = (info.pin ? '📌 ' : '') + (info.running ? (info.accountName || info.pinName) : (info.pinName || info.accountName)); badge.replaceChildren(name);
    badge.title = info.running ? rt('正在通过此账号运行', 'Running on this account') : info.pin ? rt('已固定到此账号', 'Pinned to this account') : rt('最近一次使用的账号', 'Last used account');
  });
  const chip = $('#chat-live');
  if (chip && chatView) {
    const id = chatView.sessionId || chatView.liveId, info = routeOf(id);
    const running = info && info.running, name = info && info.accountName;
    chip.className = 'chat-live' + (running ? ' running' : '');
    chip.hidden = !name;
    chip.textContent = name ? `${running ? rt('运行中', 'Running') : rt('最近', 'Last')} · ${name}` : '';
    chip.title = info ? [info.model, info.lastStatus && 'HTTP ' + info.lastStatus].filter(Boolean).join(' · ') : '';
    const sel = $('#chat-route');
    if (sel && document.activeElement !== sel) {
      const cur = chatView.sessionId ? ((routeInfo && routeInfo.routes[chatView.sessionId.toLowerCase()]) || '') : (chatView.accountId || '');
      const html = routeOptions(cur); if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; syncChatPicker(sel); }
    }

}
const newBtnLabel = type => type === 'sessions' ? '＋ ' + ui('新对话', 'New chat', '新しいチャット') : t('newBtn');
function syncChatPicker(select) {

}

        preview.hidden = false; $('#route-form-error').textContent = '';
        return env;
      } catch { if (showError) throw new Error(rt('配置未能识别，请参考示例。需要包含 ANTHROPIC_AUTH_TOKEN 或 ANTHROPIC_API_KEY。', 'Unable to parse. See the example and include ANTHROPIC_AUTH_TOKEN or ANTHROPIC_API_KEY.')); }
    }
    $('#route-env').addEventListener('input', () => { clearTimeout(parseTimer); parseTimer = setTimeout(() => { try { readEnv(true); } catch (e) { $('#route-form-error').textContent = $('#route-env').value.trim() ? e.message : ''; } }, 250); });
    $('#route-use-example').onclick = () => { $('#route-env').value = JSON.stringify(envExample, null, 2); readEnv(); $('#route-env').focus(); };
    $('#route-manual').addEventListener('toggle', () => { if ($('#route-manual').open && parsedEnv) { $('#route-env').value = ''; $('#route-preview').hidden = true; } });
    $('#route-form').onsubmit = async e => {
      e.preventDefault(); if (busy) return; busy = true; $('#route-submit').disabled = true; $('#route-form-error').textContent = '';
      try {
        clearTimeout(parseTimer);
        if ($('#route-env').value.trim()) readEnv();
        else if (!editing && !$('#route-manual').open) readEnv();
        const id = editing || crypto.randomUUID();
        if (!$('#route-url').value.trim()) throw new Error(rt('请填写服务地址', 'Enter a service URL'));
        if (!editing && $('#route-auth').value !== 'passthrough' && !$('#route-token').value.trim()) throw new Error(rt('请填写 Token', 'Enter a token'));
        const url = $('#route-url').value.trim();
        let name = $('#route-name').value.trim();
        if (!name) name = new URL(url).hostname + ' · ' + (routeData.accounts.length + 1);
        let modelMap; try { modelMap = JSON.parse($('#route-models').value || '{}'); } catch { throw new Error(rt('高级设置中的模型映射 JSON 格式有误', 'Invalid model mapping JSON in advanced settings')); }
        const account = { id, name, url, token: $('#route-token').value.trim(), authType: $('#route-auth').value, modelMap, ...(parsedEnv ? { env: parsedEnv } : {}), enabled: routeData.accounts.find(a => a.id === editing)?.enabled !== false };
        const accounts = editing ? routeData.accounts.map(a => a.id === editing ? account : a) : [...routeData.accounts, account];
        await save({ ...routeData, accounts, selected: routeData.selected || accounts.find(a => a.enabled)?.id || '' }); closeForm();
      } catch (e) { $('#route-form-error').textContent = e.message; }
      finally { busy = false; $('#route-submit').disabled = false; }
    };
    $('#route-mode').onchange = e => run(async () => { try { await save({ ...routeData, mode: e.target.value, selected: routeData.selected || routeData.accounts.find(a => a.enabled)?.id || '' }); } finally { $('#route-mode').value = routeData.mode; } });
    $('#route-refresh').onclick = () => run(async () => { routeData = await api('GET', 'proxy'); draw(); });
    $('#account-usage-refresh').onclick = loadAccountUsage;
    $('#route-reset').onclick = () => run(async () => { routeData = await api('POST', 'proxy/reset', {}); draw(); });
    $('#route-accounts').onclick = e => run(async () => {
      const action = e.target.closest('[data-action]')?.dataset.action;
      const id = e.target.closest('[data-account]')?.dataset.account;
      if (!action || !id) return;
      const a = routeData.accounts.find(a => a.id === id);
      if (action === 'edit') return openForm(a);
      if (action === 'use') { await save({ ...routeData, mode: 'manual', selected: id }); toast(routeData.restartRequired ? rt('已切换，请重开 Claude 加载额外环境变量', 'Switched. Restart Claude to load additional env.') : rt('已切换，下次请求生效', 'Switched for the next request')); return; }
      let accounts = routeData.accounts.map(a => ({ ...a }));
      if (action === 'delete') accounts = accounts.filter(a => a.id !== id);
      if (action === 'toggle') accounts.find(a => a.id === id).enabled = !a.enabled;
      const i = accounts.findIndex(a => a.id === id);
      if (action === 'up' && i > 0) [accounts[i - 1], accounts[i]] = [accounts[i], accounts[i - 1]];
      if (action === 'down' && i < accounts.length - 1) [accounts[i + 1], accounts[i]] = [accounts[i], accounts[i + 1]];
      await save({ ...routeData, accounts, selected: accounts.some(a => a.id === routeData.selected && a.enabled) ? routeData.selected : accounts.find(a => a.enabled)?.id || '' });
    });
    draw();
  } catch (e) { toast(e.message, false); }
}

// ---------- 全站内容窗口 ----------
let expandedWindow = null;
function closeExpandedWindow() {
  if (!expandedWindow) return;
  const { dialog, node, marker, focus, scrollTop, scrollLeft } = expandedWindow;
  expandedWindow = null;
  if (marker.isConnected) marker.replaceWith(node);
  node.classList.remove('is-expanded-window');
  node.scrollTop = scrollTop; node.scrollLeft = scrollLeft;
  dialog.close(); dialog.remove();
  if (focus?.isConnected) focus.focus({ preventScroll: true });
}
function expandWindow(node, focus) {
  closeExpandedWindow();
  const marker = document.createComment('expanded window');
  node.before(marker);
  const dialog = document.createElement('dialog'); dialog.className = 'expanded-dialog';
  dialog.setAttribute('aria-label', ui('放大窗口', 'Expanded window'));
  const bar = document.createElement('div'); bar.className = 'expanded-dialog-bar';
  const hint = document.createElement('span'); hint.textContent = ui('Ctrl / ⌘ + F 搜索全文', 'Ctrl / ⌘ + F to search');
  const close = document.createElement('button'); close.type = 'button'; close.className = 'btn';
  close.textContent = ui('收起 · Esc', 'Restore · Esc'); close.onclick = closeExpandedWindow;
  bar.append(hint, close);
  const content = document.createElement('div'); content.className = 'expanded-dialog-content';
  expandedWindow = { dialog, node, marker, focus, scrollTop: node.scrollTop, scrollLeft: node.scrollLeft };
  node.classList.add('is-expanded-window');
  content.append(node); dialog.append(bar, content); marker.before(dialog);
  dialog.addEventListener('cancel', e => { e.preventDefault(); closeExpandedWindow(); });
  dialog.showModal(); close.focus();
}
function addInlineExpansion(parent, content) {
  const button = document.createElement('button'); button.type = 'button'; button.className = 'btn content-expand';
  button.setAttribute('aria-expanded', 'false');
  const update = () => { button.textContent = ui(content.classList.contains('show-full-content') ? '收起全文' : '展开全文', content.classList.contains('show-full-content') ? 'Collapse text' : 'Expand text'); };
  content.setExpanded = open => { content.classList.toggle('show-full-content', open); button.setAttribute('aria-expanded', String(open)); update(); };
  button.onclick = () => content.setExpanded(!content.classList.contains('show-full-content'));
  parent.append(button); update();
}
function installWindowControls() {
  document.querySelectorAll('#render pre, #render .chart, #render .bubble, #render .chat-message, #render .capture-context, #render .chat-messages, #render .route-account, #render .card, #render .leg-sessions, #render .chat-tool, #render .route-empty, #render .account-usage-row, #render #river, #editor').forEach(node => {
    if (node.classList.contains('is-expanded-window') || node.windowExpandButton?.isConnected) return;
    node.dataset.expandable = 'true';
    let host = node;
    if (node.matches('pre, textarea')) {
      host = document.createElement('div'); host.className = 'expandable-text-window';
      node.before(host); host.append(node);
    }
    host.classList.add('expandable-window');
    const button = document.createElement('button'); button.type = 'button'; button.className = 'window-expand';
    button.textContent = '⛶'; button.title = ui('放大窗口', 'Expand window'); button.setAttribute('aria-label', button.title);
    button.onclick = e => { e.stopPropagation(); expandWindow(node, button); };
    host.append(button);
    node.windowExpandButton = button;
  });
}
const windowObserver = new MutationObserver(installWindowControls);
windowObserver.observe($('#render'), { childList: true, subtree: true });
installWindowControls();
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') {
    const root = expandedWindow?.node || $('#render');
    root.querySelectorAll('details:not(.route-more):not(.chat-picker)').forEach(node => { node.open = true; node.populateForSearch?.(); });
    root.querySelectorAll('pre, .capture-context').forEach(node => { if (node.setExpanded) node.setExpanded(true); else node.classList.add('show-full-content'); });
    // Keep native browser Find, including its match count and next/previous shortcuts.
  }
});

// ---------- 初始化 ----------
applyLang();
restoreRoute();
loadCounts();
loadProjects();
</script>
